</style></head><body><div id="app"><div id="field"><canvas id="screen"></canvas><div id="hud"><div><span id="hpText">HP 120/120</span><div class="meter"><i id="hpBar"></i></div><small id="unitText">BASTION</small></div><div id="enemyHud"><span id="targetText">TARGET 1 / 3</span><div class="meter" id="enemyHp"><i></i></div><small>BREAK</small><div class="meter" id="enemyBreak"><i></i></div></div></div><div id="lowHud"><span>S-GAUGE</span><div id="sg"><i></i></div><span id="timer">00:00.00</span></div><button id="pause" class="hide">一時停止</button><div id="overlay"></div></div><div id="ctrl"><div id="actions"><button class="act" id="fire">A<br>反転</button><button class="act" id="def">D<br>防御</button><button class="act" id="special">S<br>特殊</button></div><div id="stick"><div id="nub"></div></div><div id="clabel">中央スティック：移動・機体の向き　／　射撃は自動</div></div></div><script>

function title(){phase='title';paused=false;$('#pause').classList.add('hide');overlay.classList.remove('hide');overlay.innerHTML=`<small>v0.13 / ARC DRIVE — TOP-DOWN PROTOTYPE</small><h1>BREAK VECTOR</h1><p>完全俯瞰アリーナ。移動方向へ機体が向き、その正面にある扇形の攻撃範囲で自動射撃。横や背後に回ってブレイクを狙おう。</p><h2>機体を選択</h2><div class="crafts"><button class="craft" data-unit="bastion"><b>BASTION</b><br>高耐久／高威力<br>射程：長い・扇形70°<br>D：ガード<br>S：ブレイクキャノン</button><button class="craft" data-unit="swift"><b>SWIFT</b><br>高速移動／連射<br>射程：短い・扇形100°<br>D：無敵回避<br>S：オーバードライブ</button></div><div class="panel"><b>操作</b><br>中央スティック：移動／向き変更<br>射撃：敵が扇形に入ると自動（青→金色）<br>A：向きを180°反転（停止中の方向転換にも）<br>D：BASTIONはガード、SWIFTは回避<br>S：ゲージ100で機体固有の必殺技<br>PC：WASD／矢印キーで移動、Jで反転、Kで防御、Lで特殊<br><b>敵の攻撃予兆は赤い扇形。攻撃方向は予兆開始時に固定されます。</b></div>${rankHTML()}<button id="start" class="primary">戦闘開始</button>`;document.querySelectorAll('[data-unit]').forEach(b=>{b.onclick=()=>{chosen=b.dataset.unit;document.querySelectorAll('[data-unit]').forEach(x=>x.classList.toggle('selected',x.dataset.unit===chosen))}});$(`[data-unit="${chosen}"]`).classList.add('selected');$('#start').onclick=start}

function update(dt){if(phase!=='play'||paused)return;elapsed+=dt;clock+=dt;shotCD=Math.max(0,shotCD-dt);defCD=Math.max(0,defCD-dt);guard=Math.max(0,guard-dt);dodge=Math.max(0,dodge-dt);over=Math.max(0,over-dt);success=Math.max(0,success-dt);reverseCD=Math.max(0,reverseCD-dt);hitFlash=Math.max(0,hitFlash-dt);shake=Math.max(0,shake-dt*19);noticeTime=Math.max(0,noticeTime-dt);
