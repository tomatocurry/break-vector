<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><title>BREAK VECTOR v0.8 | ONE HAND</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#06101d;color:#ecf5ff}#app{position:relative;max-width:490px;margin:auto;min-height:100dvh;background:#0b1729;overflow:hidden}#game{display:block;width:100%;height:100dvh;touch-action:none}#hud{position:absolute;inset:env(safe-area-inset-top) 12px auto;top:max(12px,env(safe-area-inset-top));display:none;pointer-events:none;text-shadow:0 1px 5px #000}#hud .top{display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:750}#hpTrack,#sTrack{height:8px;border-radius:9px;background:#243b53;overflow:hidden;margin:5px 0 9px}#hpFill,#sFill{height:100%;background:#6ce5b9;width:100%;transition:width .15s}#sFill{background:#e8bc67;width:0}#special{position:absolute;right:18px;bottom:max(42px,calc(env(safe-area-inset-bottom) + 27px));width:82px;height:82px;border:2px solid #8b7b86;border-radius:50%;background:#374159;color:white;font-size:15px;font-weight:900;display:none;touch-action:none;z-index:3}#special.ready{background:#9a567d;border-color:#ffe7aa;box-shadow:0 0 25px #b6638799}#tip{position:absolute;bottom:max(138px,calc(env(safe-area-inset-bottom) + 126px));left:12px;font-size:11px;color:#bdd7e9;pointer-events:none;display:none}#overlay{position:absolute;inset:0;background:#06111feF;z-index:5;overflow:auto;padding:calc(max(22px,env(safe-area-inset-top)) + 10px) 22px max(35px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center}#overlay.hidden{display:none}#panel{width:100%;max-width:390px}h1{font-size:30px;letter-spacing:.06em;margin:5px 0 4px;color:#a1ecff}h2{font-size:17px;color:#d7eefe;margin:16px 0 7px}p{font-size:13px;line-height:1.7;color:#c0d1e3}.eyebrow{font-size:11px;color:#72cfe0;letter-spacing:.14em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.craft{border:2px solid #3e637e;border-radius:14px;background:#11253a;text-align:left;color:white;padding:12px 9px;min-height:126px}.craft.selected{border-color:#a9f3ff;background:#21445a}.craft b{display:block;margin-bottom:7px;color:#b3ebfc}.craft span{font-size:12px;line-height:1.6;color:#cad8e8}.guide{font-size:12px;background:#13263b;border:1px solid #34536d;border-radius:12px;padding:11px 13px;line-height:1.75}.primary{width:100%;border:0;background:#8be7ed;color:#092334;border-radius:12px;padding:14px;font-size:17px;font-weight:800;margin-top:15px}.ranks{margin:12px 0;background:#0e2135;border:1px solid #355571;border-radius:12px;padding:10px}.rankRow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;padding:5px;border-top:1px solid #294359;font-size:13px}.rankRow:first-of-type{border-top:0}.rankRow span:last-child{font-variant-numeric:tabular-nums}.inputline{display:flex;gap:8px}.inputline input{flex:1;min-width:0;padding:12px;font-size:16px;background:#0a1a2a;color:white;border:1px solid #67849a;border-radius:8px}.inputline button{border:0;border-radius:8px;background:#8be7ed;color:#062132;padding:10px;font-weight:800}#pause{position:absolute;left:12px;bottom:max(25px,env(safe-area-inset-bottom));font-size:12px;background:#21374bbb;border:1px solid #4d7189;border-radius:8px;color:#e1f5ff;padding:8px 12px;display:none;z-index:3}
</style></head><body><div id="app"><canvas id="game"></canvas><div id="hud"><div class="top"><span id="hpText">HP 100</span><span id="enemyText">ENEMY 1 / 3</span><span id="timerText">00:00.00</span></div><div id="hpTrack"><div id="hpFill"></div></div><div class="top"><span id="craftText">BASTION</span><span id="gaugeText">S GAUGE 0%</span></div><div id="sTrack"><div id="sFill"></div></div></div><div id="tip">タップ：射撃 / ドラッグ：移動＋自動射撃<br><span id="defenseTip">長押し：ガード</span></div><button id="special" type="button">S<br>CHARGE</button><button id="pause" type="button">Ⅱ</button><div id="overlay"><div id="panel"></div></div></div><script>
'use strict';
const $=id=>document.getElementById(id),c=$('game'),g=c.getContext('2d');let W=0,H=0,DPR=1;
function resize(){W=c.clientWidth;H=c.clientHeight;DPR=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);g.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const CRAFT={guardian:{name:'BASTION',speed:.56,hp:120,damage:15,fire:.35,defense:'guard',color:'#7ce5f3'},striker:{name:'SWIFT',speed:.86,hp:90,damage:10,fire:.22,defense:'dodge',color:'#c5a8ff'}};
let selected='guardian',state='title',player=null,enemy=null,wave=0,timer=0,last=performance.now(),projectiles=[],effects=[],pointer=null,keys={},ranks=[];
const KEY='break-vector-clear-time-v1';function loadRanks(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x.filter(v=>v&&typeof v.name==='string'&&Number.isFinite(v.time)&&v.time>0).sort((a,b)=>a.time-b.time).slice(0,5):[]}catch{return []}}ranks=loadRanks();
const fmt=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}.${String(Math.floor(t*100)%100).padStart(2,'0')}`;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const esc=s=>s.replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function rankHTML(){return `<div class="ranks"><b>TOP 5 / CLEAR TIME</b>${ranks.length?ranks.map((r,i)=>`<div class="rankRow"><span>${i+1}.</span><span>${esc(r.name)}</span><span>${fmt(r.time)}</span></div>`).join(''):'<p>まだ記録がありません</p>'}</div>`}
function title(){state='title';$('overlay').classList.remove('hidden');$('hud').style.display='none';$('special').style.display='none';$('tip').style.display='none';$('pause').style.display='none';$('panel').innerHTML=`<div class="eyebrow">ONE HAND PROTOTYPE / v0.8</div><h1>BREAK VECTOR</h1><p>疑似3D・背面視点の片手アクション。敵の予兆を読み、攻防の成功でSゲージを溜めよう。3機撃破までのタイムアタック。</p><h2>機体選択</h2><div class="grid"><button class="craft ${selected==='guardian'?'selected':''}" data-craft="guardian"><b>BASTION</b><span>安定型 / HP高<br>移動中に自動射撃<br>長押しでガード<br>防御成功で敵硬直</span></button><button class="craft ${selected==='striker'?'selected':''}" data-craft="striker"><b>SWIFT</b><span>機動型 / 高速<br>移動中に自動射撃<br>フリックで無敵回避<br>回避成功でS大量獲得</span></button></div><h2>操作方法</h2><div class="guide">👆 タップ：通常射撃<br>↔ ドラッグ：縦横移動＋自動射撃<br>⚡ Sボタン：ゲージ100で特殊攻撃<br>🛡 BASTION：長押しガード<br>💨 SWIFT：素早くフリックで回避<br>PC：マウスのドラッグ／クリック、SpaceでS</div>${rankHTML()}<button id="start" class="primary">出撃する</button>`;document.querySelectorAll('.craft').forEach(b=>b.onclick=()=>{selected=b.dataset.craft;title()});$('start').onclick=start}
function spawn(){wave++;let hp=[95,150,210][wave-1];enemy={x:(wave===2?.35:wave===3?-.3:0),z:.87,hp,maxHp:hp,radius:.075,color:['#f48faa','#ffb879','#f17fa0'][wave-1],mode:'aim',clock:1.2,wind:0,stun:0,flash:0};projectiles=[]}
function start(){state='play';player={x:0,z:.2,hp:CRAFT[selected].hp,maxHp:CRAFT[selected].hp,gauge:0,shot:0,inv:0,guard:0,guardCD:0,dodgeCD:0,dodgeT:0,dodgeX:0,dodgeZ:0,flash:0};wave=0;timer=0;projectiles=[];effects=[];pointer=null;spawn();$('overlay').classList.add('hidden');$('hud').style.display='block';$('special').style.display='block';$('tip').style.display='block';$('pause').style.display='block';$('defenseTip').textContent=selected==='guardian'?'長押し：ガード':'フリック：無敵回避';updateHUD()}
function finish(win){if(state!=='play')return;state='result';pointer=null;$('overlay').classList.remove('hidden');$('hud').style.display='none';$('special').style.display='none';$('tip').style.display='none';$('pause').style.display='none';let qualify=win&&(ranks.length<5||timer<ranks[4].time);$('panel').innerHTML=`<div class="eyebrow">MISSION REPORT / v0.8</div><h1>${win?'MISSION CLEAR':'MISSION FAILED'}</h1><p>${win?'敵機3機を撃破。作戦達成！':'機体が戦闘不能。回避やガードのタイミングを見直そう。'}<br>選択機体：${CRAFT[selected].name}<br>撃破数：${win?3:wave-1} / 3<br>タイム：<b>${fmt(timer)}</b></p>${qualify?'<h2>🏆 TOP 5 入賞</h2><div class="inputline"><input id="rankName" maxlength="12" placeholder="PILOT"><button id="saveRank">登録</button></div>':''}<div id="results">${rankHTML()}</div><button class="primary" id="again">トップへ戻る</button>`;$('again').onclick=title;if(qualify){$('saveRank').onclick=()=>{let name=($('rankName').value.trim()||'PILOT').slice(0,12);ranks.push({name,time:timer});ranks.sort((a,b)=>a.time-b.time);ranks=ranks.slice(0,5);try{localStorage.setItem(KEY,JSON.stringify(ranks))}catch{}$('results').innerHTML=rankHTML();document.querySelector('.inputline')?.remove()}}}
function gauge(n){player.gauge=clamp(player.gauge+n,0,100)}function shoot(){if(!enemy||enemy.hp<=0||player.shot>0)return;player.shot=CRAFT[selected].fire;let dx=enemy.x-player.x,dz=enemy.z-player.z,dist=Math.hypot(dx,dz);if(dist<.84){let dmg=CRAFT[selected].damage;enemy.hp-=dmg;enemy.flash=.12;effects.push({x:enemy.x,z:enemy.z,t:.24,type:'hit'});gauge(selected==='guardian'?18:15);if(enemy.hp<=0){effects.push({x:enemy.x,z:enemy.z,t:.55,type:'blast'});if(wave===3){finish(true)}else spawn()}}else effects.push({x:player.x,z:player.z,t:.15,type:'miss'})}
function special(){if(state!=='play'||player.gauge<100)return;player.gauge=0;player.inv=Math.max(player.inv,.35);if(enemy){enemy.hp-=selected==='guardian'?78:66;enemy.stun=1.15;enemy.flash=.35;effects.push({x:enemy.x,z:enemy.z,t:.7,type:'blast'});if(enemy.hp<=0){if(wave===3)finish(true);else spawn()}}updateHUD()}
$('special').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();special()});$('pause').onclick=()=>{if(state==='play'){state='paused';$('overlay').classList.remove('hidden');$('panel').innerHTML='<h1>PAUSED</h1><button class="primary" id="resume">再開</button><button class="primary" id="quit">タイトルへ</button>';$('resume').onclick=()=>{state='play';$('overlay').classList.add('hidden')};$('quit').onclick=title}};
function guard(){if(selected!=='guardian'||state!=='play'||player.guard>0||player.guardCD>0)return;player.guard=.82;player.guardCD=1.85;effects.push({x:player.x,z:player.z,t:.18,type:'shield'})}
function dodge(dx,dz){if(selected!=='striker'||state!=='play'||player.dodgeCD>0)return;let len=Math.hypot(dx,dz)||1;player.dodgeX=dx/len;player.dodgeZ=dz/len;player.dodgeT=.18;player.inv=.38;player.dodgeCD=1.15;effects.push({x:player.x,z:player.z,t:.32,type:'dodge'})}
function pos(e){const r=c.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
c.addEventListener('pointerdown',e=>{if(state!=='play')return;if(e.target!==c)return;e.preventDefault();c.setPointerCapture(e.pointerId);let p=pos(e);pointer={id:e.pointerId,start:p,last:p,t:performance.now(),moving:false,held:false,dx:0,dy:0};shoot()});
c.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;e.preventDefault();let p=pos(e),dx=p.x-pointer.start.x,dy=p.y-pointer.start.y;pointer.last=p;pointer.dx=dx;pointer.dy=dy;if(Math.hypot(dx,dy)>9)pointer.moving=true});
function release(e){if(!pointer||pointer.id!==e.pointerId)return;let q=pointer;pointer=null;let duration=(performance.now()-q.t)/1000,dist=Math.hypot(q.dx,q.dy);if(selected==='striker'&&duration<.24&&dist>32)dodge(q.dx,-q.dy)}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',()=>{pointer=null});
addEventListener('keydown',e=>{if(e.code==='Space'&&state==='play'){e.preventDefault();special()}if(e.code==='Escape'&&state==='play')$('pause').click();keys[e.code]=true});addEventListener('keyup',e=>{keys[e.code]=false});
function updateHUD(){if(!player)return;$('hpText').textContent=`HP ${Math.ceil(player.hp)} / ${player.maxHp}`;$('hpFill').style.width=100*player.hp/player.maxHp+'%';$('enemyText').textContent=`ENEMY ${wave} / 3`;$('timerText').textContent=fmt(timer);$('craftText').textContent=CRAFT[selected].name;$('gaugeText').textContent=`S GAUGE ${Math.floor(player.gauge)}%`;$('sFill').style.width=player.gauge+'%';$('special').classList.toggle('ready',player.gauge>=100);$('special').innerHTML=player.gauge>=100?'S<br>READY':`S<br>${Math.floor(player.gauge)}%`}
function update(dt){if(state!=='play')return;timer+=dt;for(let k of ['shot','inv','guard','guardCD','dodgeCD','dodgeT','flash'])player[k]=Math.max(0,player[k]-dt);for(let k of ['flash','stun'])enemy[k]=Math.max(0,enemy[k]-dt);
let vx=0,vz=0,auto=false;if(pointer){const t=(performance.now()-pointer.t)/1000;if(selected==='guardian'&&!pointer.moving&&t>.36&&!pointer.held){pointer.held=true;guard()}if(pointer.moving){vx=clamp(pointer.dx/64,-1,1);vz=clamp(-pointer.dy/80,-1,1);auto=true}else if(!pointer.held){auto=true}}
if(keys.ArrowLeft||keys.KeyA)vx=-1;if(keys.ArrowRight||keys.KeyD)vx=1;if(keys.ArrowUp||keys.KeyW)vz=1;if(keys.ArrowDown||keys.KeyS)vz=-1;if(keys.KeyJ)auto=true;if(keys.KeyK&&selected==='guardian')guard();if(keys.KeyK&&selected==='striker')dodge(vx||1,vz);
if(player.dodgeT>0){vx=player.dodgeX*1.9;vz=player.dodgeZ*1.9}let speed=CRAFT[selected].speed*(player.guard>0?.45:1);let length=Math.max(1,Math.hypot(vx,vz));player.x=clamp(player.x+vx/length*speed*dt,-.91,.91);player.z=clamp(player.z+vz/length*speed*dt,.07,.64);if(auto&&player.guard<=0&&player.dodgeT<=0)shoot();
if(enemy.stun<=0){enemy.clock-=dt;if(enemy.mode==='aim'){enemy.x+=(player.x-enemy.x)*dt*.15;if(enemy.clock<=0){enemy.mode='warn';enemy.wind=.72;enemy.aimX=player.x;enemy.aimZ=player.z}}else if(enemy.mode==='warn'){enemy.wind-=dt;if(enemy.wind<=0){projectiles.push({x:enemy.x,z:enemy.z,tx:enemy.aimX,tz:enemy.aimZ,t:0,duration:.66,checked:false});enemy.mode='recover';enemy.clock=.75}}else if(enemy.mode==='recover'){if(enemy.clock<=0){enemy.mode='aim';enemy.clock=Math.max(.9,1.65-wave*.12)}}}else{enemy.mode='recover';enemy.clock=Math.max(enemy.clock,.6)}
for(let p of projectiles){p.t+=dt;if(!p.checked&&p.t>=p.duration){p.checked=true;let hit=Math.hypot(player.x-p.tx,player.z-p.tz)<.27;if(hit){if(player.guard>0){gauge(10);enemy.stun=1.2;enemy.x=clamp(enemy.x+Math.sign(enemy.x-player.x||1)*.18,-.9,.9);effects.push({x:player.x,z:player.z,t:.4,type:'shield'})}else if(player.inv>0){if(selected==='striker')gauge(45);effects.push({x:player.x,z:player.z,t:.4,type:'dodge'})}else{player.hp-=24;player.flash=.3;player.inv=.65;if(player.hp<=0){player.hp=0;finish(false);break}}}}}projectiles=projectiles.filter(p=>p.t<p.duration+.24);effects.forEach(e=>e.t-=dt);effects=effects.filter(e=>e.t>0);if(state==='play')updateHUD()}
function project(x,z){let d=clamp(z,0,1),scale=.57+d*.75;return {x:W/2+x*W*(.23+d*.22),y:H*(.69-d*.51),scale}}
function polygon(points,color,stroke){g.beginPath();points.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fillStyle=color;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke()}}
function draw(){g.clearRect(0,0,W,H);let grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#070f25');grad.addColorStop(.6,'#15304c');grad.addColorStop(1,'#102338');g.fillStyle=grad;g.fillRect(0,0,W,H);let horizon=H*.2;g.strokeStyle='#31516b77';g.lineWidth=1;for(let i=-5;i<=5;i++){g.beginPath();g.moveTo(W/2+i*W*.018,horizon);g.lineTo(W/2+i*W*.22,H);g.stroke()}for(let i=0;i<12;i++){let q=H*(.22+Math.pow(i/12,1.5)*.8);g.beginPath();g.moveTo(0,q);g.lineTo(W,q);g.stroke()}
if(!player||!enemy)return;let ep=project(enemy.x,enemy.z),pp=project(player.x,player.z);
if(enemy.mode==='warn'){let aim=project(enemy.aimX,enemy.aimZ);g.strokeStyle='#ff6778';g.lineWidth=3;g.setLineDash([9,6]);g.beginPath();g.moveTo(ep.x,ep.y);g.lineTo(aim.x,aim.y);g.stroke();g.setLineDash([]);g.beginPath();g.arc(aim.x,aim.y,20+enemy.wind*17,0,Math.PI*2);g.stroke()}
let ew=38*ep.scale;polygon([[ep.x,ep.y-ew],[ep.x+ew*.8,ep.y+ew*.7],[ep.x,ep.y+ew*.35],[ep.x-ew*.8,ep.y+ew*.7]],enemy.flash>0?'#ffffff':enemy.color,'#ffe0e8');g.fillStyle='#26364d';g.fillRect(ep.x-33,ep.y-ew-22,66,6);g.fillStyle='#ff7889';g.fillRect(ep.x-33,ep.y-ew-22,66*enemy.hp/enemy.maxHp,6);
for(let pr of projectiles){let t=Math.min(1,pr.t/pr.duration),a=project(pr.x,pr.z),b=project(pr.tx,pr.tz);g.beginPath();g.arc(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,8+t*5,0,Math.PI*2);g.fillStyle='#ffa765';g.fill()}
if(player.guard>0){g.beginPath();g.arc(pp.x,pp.y,40,0,Math.PI*2);g.strokeStyle='#70edee';g.lineWidth=6;g.stroke()}
if(!(player.inv>0&&Math.floor(timer*18)%2===0)){let pw=40*pp.scale;polygon([[pp.x,pp.y-pw],[pp.x+pw*.8,pp.y+pw*.7],[pp.x,pp.y+pw*.25],[pp.x-pw*.8,pp.y+pw*.7]],player.flash>0?'#fff':CRAFT[selected].color,'#f2faff');polygon([[pp.x,pp.y-pw*.8],[pp.x+5,pp.y+pw*.3],[pp.x-5,pp.y+pw*.3]],'#dff8ff')}
for(let e of effects){let a=project(e.x,e.z);g.beginPath();g.arc(a.x,a.y,11+35*(1-Math.min(e.t,.6)/.6),0,2*Math.PI);g.strokeStyle=e.type==='hit'?'#fff0a3':e.type==='shield'?'#85f5ed':'#d3a0ff';g.lineWidth=3;g.stroke()}
if(state==='paused'){g.fillStyle='#0008';g.fillRect(0,0,W,H)}}
function loop(now){let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}title();requestAnimationFrame(loop);
</script></body></html>
