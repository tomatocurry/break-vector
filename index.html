function showTitle(){phase='title';paused=false;$('#pause').classList.add('hidden');$('#panel').classList.remove('hidden');$('#panel').innerHTML=`<span class="minor">ISOMETRIC COMBAT PROTOTYPE / v0.9</span><h1>BREAK VECTOR</h1><p>射程を見極めて自動射撃。敵の攻撃をガード・回避してSゲージを溜め、3機撃破の最速タイムを狙おう。</p><h2>機体選択</h2><div class="crafts"><button class="craft" data-craft="bastion"><b>BASTION</b><br>HP120 / 中速<br>ガード・ジャストガード<br>S：ブレイクキャノン</button><button class="craft" data-craft="swift"><b>SWIFT</b><br>HP90 / 高速<br>フリックではなくDボタンで回避<br>S：オーバードライブ</button></div><div class="note">📱 左スティック：移動／射程内で自動攻撃<br>D：BASTIONはガード、SWIFTは無敵回避<br>S：ゲージ100で特殊アクション<br>BASTIONはガード耐久値に注意。攻撃直前のジャストガードで敵を硬直させます。SWIFTは敵攻撃を回避すると大量のSゲージを獲得します。<br>⌨️ PC：WASD／矢印で移動・Kで防御・LまたはSpaceでS</div>${rankHTML()}<button class="primary" id="start">戦闘を開始</button>`;document.querySelectorAll('.craft').forEach(b=>b.onclick=()=>{selected=b.dataset.craft;document.querySelectorAll('.craft').forEach(x=>x.classList.toggle('selected',x.dataset.craft===selected))});document.querySelector(`[data-craft="${selected}"]`).classList.add('selected');$('#start').onclick=start}

function updateHUD(){if(!p)return;$('#craftLabel').textContent=TYPES[selected].name;$('#hp').textContent=Math.ceil(p.hp);$('#hpFill').style.width=100*p.hp/p.maxHp+'%';$('#guardLabel').textContent=selected==='bastion'?'GUARD '+Math.floor(p.guardIntegrity)+'%':p.overdrive>0?'OVERDRIVE '+p.overdrive.toFixed(1)+'s':'DODGE';$('#guardBar').style.display=selected==='bastion'?'block':'none';$('#guardFill').style.width=p.guardIntegrity+'%';$('#waveLabel').textContent='ENEMY '+wave+' / 3';$('#timer').textContent=fmt(elapsed);$('#spFill').style.width=p.sp+'%';$('#spText').textContent=Math.floor(p.sp)+'%';$('#def').innerHTML=selected==='bastion'?'D<br>ガード':'D<br>回避';$('#def').disabled=selected==='bastion'?p.guardT>0||p.guardCD>0||p.broken>0:p.dodgeCD>0;$('#spec').disabled=p.sp<100;$('#spec').innerHTML=selected==='bastion'?'S<br>砲撃':'S<br>強化'}

// Isometric floor: world coordinates remain 2D; projection only affects presentation.
const project=(x,y)=>({x:W/2+(x-y)*.72,y:300+(x+y)*.37});
function poly(points,fill,stroke,width=1){ctx.beginPath();points.forEach((a,i)=>i?ctx.lineTo(a.x,a.y):ctx.moveTo(a.x,a.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=width;ctx.strokeStyle=stroke;ctx.stroke()}}
