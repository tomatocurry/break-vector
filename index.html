<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BREAK VECTOR v0.11 — TARGET SHIFT</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#070f1c;color:#e6f4ff;font:14px system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:none}#app{height:100dvh;max-width:540px;margin:auto;display:flex;flex-direction:column;gap:5px;padding:calc(4px + env(safe-area-inset-top)) 5px calc(4px + env(safe-area-inset-bottom))}#field{position:relative;min-height:0;flex:1;border:1px solid #365778;border-radius:11px;overflow:hidden;background:#10243c}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;left:9px;top:7px;right:9px;pointer-events:none;display:flex;justify-content:space-between;gap:10px;font-weight:800;text-shadow:0 1px 4px #000;font-size:12px}#hud small{color:#afd0df;font-size:10px}.meter{height:7px;background:#23364d;border-radius:9px;width:120px;overflow:hidden;margin-top:4px}.meter i{height:100%;display:block;background:#64d9ce;width:100%}#enemyHud{text-align:right}#enemyHud .meter{margin-left:auto}#enemyHp i{background:#ed7794}#enemyBreak i{background:#efc770}#bottomHud{position:absolute;bottom:7px;left:9px;right:9px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:bold;pointer-events:none;text-shadow:0 1px 4px #000}#charge{height:10px;flex:1;background:#263c56;border-radius:6px;overflow:hidden}#charge i{display:block;width:0;height:100%;background:#ffcc72}#ctrl{height:170px;flex:none;position:relative;border:1px solid #41617c;border-radius:12px;background:linear-gradient(160deg,#1a3049,#0f1e35);touch-action:none;overflow:hidden}#stick{position:absolute;left:6%;top:50%;transform:translateY(-50%);height:124px;width:124px;border-radius:50%;border:2px solid #7ba8c7;background:#29506d6e;touch-action:none}#nub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:50px;width:50px;border-radius:50%;background:#7fcce5;border:2px solid #d4f6ff;pointer-events:none;box-shadow:0 0 15px #78dbf777}.act{position:absolute;border-radius:50%;height:76px;width:76px;color:#fff;border:2px solid #a8c9e0;background:#345a78;font-weight:900;overflow:hidden}.act:disabled{opacity:.48}#fire{right:30%;top:50%;transform:translateY(-50%);background:#31779a}#def{right:15%;top:8px;width:63px;height:63px;background:#3f7376}#special{right:2%;bottom:7px;width:67px;height:67px;background:#855b7d;border-color:#ebbad7}#ctrlLabel{position:absolute;right:3%;top:4px;color:#9bb7cd;font-size:10px;pointer-events:none}#overlay{position:absolute;inset:0;z-index:5;background:#081625f5;padding:18px;overflow:auto;display:flex;flex-direction:column;gap:10px}#overlay.hide{display:none}h1{margin:0;color:#8ce6e4;font-size:25px}h2{font-size:16px;margin:8px 0 0}p{line-height:1.65;margin:0;color:#cfdfeb;font-size:13px}.panel{background:#152c43;border:1px solid #365976;border-radius:9px;padding:10px;line-height:1.7;font-size:12px}.crafts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.craft{color:#e7f7ff;text-align:left;background:#173047;border:1px solid #496882;border-radius:8px;padding:10px;font-size:12px;line-height:1.6}.craft.selected{border:2px solid #85e7df;background:#234a60}.primary{background:#65d7ce;color:#072b34;border:0;border-radius:9px;padding:12px;font-weight:900}.rrow{display:grid;grid-template-columns:24px 1fr auto;padding:5px 0;border-bottom:1px solid #38516b}input{max-width:70%;border:1px solid #7da0be;background:#12283f;color:white;padding:8px;border-radius:6px}#pause{position:absolute;right:8px;top:56px;background:#1a344d;color:white;border:1px solid #789ab0;border-radius:6px;font-size:11px;padding:5px;z-index:2}#pause.hide{display:none}@media(max-width:385px){#ctrl{height:156px}#stick{width:113px;height:113px;left:4%}#fire{right:32%;height:67px;width:67px}#def{right:15%;height:57px;width:57px}#special{width:58px;height:58px}}
</style></head><body><div id="app"><div id="field"><canvas id="screen"></canvas><div id="hud"><div><span id="hpText">HP 120/120</span><div class="meter"><i id="playerHp"></i></div><small id="craftText">BASTION</small></div><div id="enemyHud"><span id="enemyText">TARGET 1 / 3</span><div id="enemyHp" class="meter"><i></i></div><small>BREAK</small><div id="enemyBreak" class="meter"><i></i></div></div></div><div id="bottomHud"><span>S-GAUGE</span><div id="charge"><i></i></div><span id="timeText">00:00.00</span></div><button id="pause" class="hide">一時停止</button><div id="overlay"></div></div><div id="ctrl"><div id="ctrlLabel">A / D / S</div><div id="stick"><div id="nub"></div></div><button id="fire" class="act">A<br>射撃</button><button id="def" class="act">D<br>防御</button><button id="special" class="act">S<br>特殊</button></div></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s);const canvas=$('#screen'),ctx=canvas.getContext('2d'),overlay=$('#overlay');const KEY='break-vector-clear-time-v1';let ranks=[];try{ranks=JSON.parse(localStorage.getItem(KEY)||'[]').filter(r=>r&&typeof r.name==='string'&&Number.isFinite(r.time)&&r.time>0).sort((a,b)=>a.time-b.time).slice(0,5)}catch{}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${(t%60).toFixed(2).padStart(5,'0')}`;const rand=(a,b)=>a+Math.random()*(b-a);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const types={bastion:{hp:120,damage:24,rate:.55,aim:250,def:'ガード',spec:'ブレイクキャノン'},swift:{hp:90,damage:12,rate:.20,aim:320,def:'回避',spec:'オーバードライブ'}};
let selected='bastion',phase='title',paused=false,player,enemy,wave=0,elapsed=0,shots=[],particles=[],aim={x:.5,y:.50},joy={x:0,y:0},stickId=null,fireHeld=false,keys={},prev=0,clock=0,shake=0,flash=0,over=0,defCool=0,guard=0,invul=0,dodgeSuccess=false,prevAttack=null,shotCool=0,storedHit=0,hitNotice='',noticeTime=0;
const rankHTML=()=>`<div class="panel"><b>TOP 5 / CLEAR TIME</b>${ranks.length?ranks.map((r,i)=>`<div class="rrow"><span>${i+1}</span><span>${esc(r.name)}</span><span>${fmt(r.time)}</span></div>`).join(''):'<p>まだ記録はありません。</p>'}</div>`;
function title(){phase='title';paused=false;$('#pause').classList.add('hide');overlay.classList.remove('hide');overlay.innerHTML=`<small>v0.11 / TARGET SHIFT</small><h1>BREAK VECTOR</h1><p>照準を自分で操作する遠距離シューティング。敵の装甲・弱点コア・武装を撃ち分け、ブレイク中の敵を一気に攻めよう。</p><h2>機体選択</h2><div class="crafts"><button class="craft" data-id="bastion"><b>BASTION</b><br>HP120／高威力<br>D：ガード（ジャスト成功で反撃）<br>S：貫通砲</button><button class="craft" data-id="swift"><b>SWIFT</b><br>HP90／高速連射<br>D：無敵回避（成功でS大幅獲得）<br>S：オーバードライブ</button></div><div class="panel"><b>操作</b><br>左スティック：照準を移動<br>A：押している間、照準位置へ射撃<br>D：ガード／回避（敵の攻撃を見切る）<br>S：ゲージ100で特殊発動<br>PC：WASD／矢印で照準、Jまたはクリックで射撃、Kで防御、Lで特殊<br><b>敵の黄色いコアは高ダメージ、左右の武装を破壊すると攻撃が弱くなる。</b></div>${rankHTML()}<button class="primary" id="start">戦闘を開始</button>`;document.querySelectorAll('.craft').forEach(b=>{b.onclick=()=>{selected=b.dataset.id;document.querySelectorAll('.craft').forEach(e=>e.classList.toggle('selected',e.dataset.id===selected))}});document.querySelector(`[data-id="${selected}"]`).classList.add('selected');$('#start').onclick=start;}
function spawn(){wave++;let hp=[360,490,640][wave-1];enemy={x:.5,y:.35,hp,max:hp,break:0,stun:0,armor:2,weapon:[65+wave*12,65+wave*12],weaponMax:65+wave*12,t:0,attack:0,wind:0,active:true,vx:(wave%2?1:-1)*.11,coreOpen:0};shots=[];hitNotice=`TARGET ${wave} / 3`;noticeTime=1.4;}
function start(){phase='play';overlay.classList.add('hide');$('#pause').classList.remove('hide');player={hp:types[selected].hp,max:types[selected].hp,s:0};wave=0;elapsed=0;clock=0;shots=[];particles=[];aim={x:.5,y:.5};shotCool=0;guard=0;defCool=0;invul=0;over=0;fireHeld=false;paused=false;spawn();updateHUD();}
function dmgEnemy(value,br=0,part='body'){if(!enemy||!enemy.active)return;const broken=enemy.stun>0;let final=value*(broken?2:1);enemy.hp=Math.max(0,enemy.hp-final);enemy.break=clamp(enemy.break+br,0,100);if(part==='core'){enemy.coreOpen=.17;player.s=clamp(player.s+16,0,100)}else{player.s=clamp(player.s+8,0,100)}burst(aim.x,aim.y,part==='core'?'#ffdb81':'#9ee8ff',11);shake=Math.max(shake,part==='core'?7:3);hitNotice=part==='core'?'WEAK POINT!':part==='weapon'?'WEAPON HIT!':broken?'BREAK DAMAGE!':'HIT';noticeTime=.38;if(enemy.break>=100&&!broken){enemy.break=0;enemy.stun=2.35;hitNotice='BREAK!';noticeTime=1.2;burst(enemy.x,enemy.y,'#ffe29a',30);shake=9;}if(enemy.hp<=0){enemy.active=false;burst(enemy.x,enemy.y,'#ffc5ae',42);if(wave===3){end(true)}else{spawn()}}}
function burst(x,y,color,n){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(.08,.35);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.18,.55),max:.55,c:color})}}
function useDef(){if(phase!=='play'||paused||defCool>0)return;defCool=selected==='bastion'?2.0:1.25;if(selected==='bastion'){guard=.95;hitNotice='GUARD';noticeTime=.3}else{invul=.42;dodgeSuccess=false;flash=.15;hitNotice='DODGE';noticeTime=.3;}}
function special(){if(phase!=='play'||paused||player.s<100)return;player.s=0;if(selected==='bastion'){if(enemy?.active){const within=Math.hypot(aim.x-enemy.x,aim.y-enemy.y)<.22;if(within){dmgEnemy(145,32,'core');enemy.stun=Math.max(enemy.stun,1.2);hitNotice='BREAK CANNON!'}else hitNotice='CANNON MISSED'}shake=9;flash=.18}else{over=5;invul=.8;hitNotice='OVERDRIVE!';flash=.12}noticeTime=.9;}
function shoot(){if(phase!=='play'||paused||!enemy?.active||shotCool>0)return;const t=types[selected];shotCool=t.rate*(over>0?.47:1);shots.push({x:.50,y:1.05,tx:aim.x,ty:aim.y,life:.13,c:over>0?'#f9b8ff':'#7ae3fb'});let dx=aim.x-enemy.x,dy=aim.y-enemy.y;const dist=Math.hypot(dx,dy);let part=null;if(dist<.098){part='body';const lx=enemy.x-.115,rx=enemy.x+.115;const left=Math.hypot(aim.x-lx,aim.y-(enemy.y+.015));const right=Math.hypot(aim.x-rx,aim.y-(enemy.y+.015));if(left<.053&&enemy.weapon[0]>0){part='weapon';enemy.weapon[0]=Math.max(0,enemy.weapon[0]-t.damage*1.1)}else if(right<.053&&enemy.weapon[1]>0){part='weapon';enemy.weapon[1]=Math.max(0,enemy.weapon[1]-t.damage*1.1)}else if(Math.hypot(dx,dy+.018)<.037){part='core'}}else if(Math.hypot(aim.x-(enemy.x-.115),aim.y-(enemy.y+.015))<.053&&enemy.weapon[0]>0){part='weapon';enemy.weapon[0]=Math.max(0,enemy.weapon[0]-t.damage*1.1)}else if(Math.hypot(aim.x-(enemy.x+.115),aim.y-(enemy.y+.015))<.053&&enemy.weapon[1]>0){part='weapon';enemy.weapon[1]=Math.max(0,enemy.weapon[1]-t.damage*1.1)}if(part){let pow=t.damage*(part==='core'?2.4:part==='weapon'?.65:1);dmgEnemy(pow,part==='core'?18:part==='weapon'?12:5,part)}else{hitNotice='MISS';noticeTime=.17}flash=.04;}
function strike(){if(!player||phase!=='play')return;let blocked=false;if(selected==='bastion'&&guard>0){const perfect=guard>.65;blocked=true;player.hp-=perfect?0:6;if(perfect){player.s=clamp(player.s+25,0,100);enemy.break=clamp(enemy.break+48,0,100);enemy.stun=1.15;hitNotice='JUST GUARD!'}else{player.s=clamp(player.s+10,0,100);hitNotice='GUARD!'}if(enemy.break>=100){enemy.break=0;enemy.stun=2.4;hitNotice='GUARD BREAK!'}noticeTime=1.0;shake=3;}
else if(invul>0){blocked=true;if(selected==='swift'&&!dodgeSuccess){dodgeSuccess=true;player.s=clamp(player.s+45,0,100);enemy.break=clamp(enemy.break+50,0,100);enemy.stun=.7;hitNotice='PERFECT DODGE!';noticeTime=1;burst(.52,.82,'#b8a6fa',13);if(enemy.break>=100){enemy.break=0;enemy.stun=2.4;hitNotice='BREAK!'}}}if(!blocked){player.hp-=selected==='bastion'?23:27;shake=10;flash=.3;hitNotice='DAMAGE!';noticeTime=.7}if(player.hp<=0)end(false)}
function end(win){phase='end';$('#pause').classList.add('hide');overlay.classList.remove('hide');const eligible=win&&(ranks.length<5||elapsed<ranks[ranks.length-1].time);overlay.innerHTML=`<small>MISSION REPORT / v0.11</small><h1>${win?'MISSION CLEAR':'MISSION FAILED'}</h1><p>${types[selected].hp===120?'BASTION':'SWIFT'} / ${win?3:wave-1}機撃破<br>記録：<b>${fmt(elapsed)}</b></p>${eligible?'<div class="panel">🏆 TOP 5入賞！<br><input id="pilot" maxlength="12" placeholder="PILOT"> <button id="register">登録</button></div>':''}<div id="ranking">${rankHTML()}</div><button class="primary" id="retry">再挑戦</button><button id="home">タイトルへ戻る</button>`;$('#retry').onclick=start;$('#home').onclick=title;if(eligible)$('#register').onclick=()=>{const name=($('#pilot').value.trim()||'PILOT').slice(0,12);ranks.push({name,time:elapsed});ranks.sort((a,b)=>a.time-b.time);ranks=ranks.slice(0,5);try{localStorage.setItem(KEY,JSON.stringify(ranks))}catch{}$('#ranking').innerHTML=rankHTML();$('#register').parentElement.remove()}}
function updateHUD(){$('#hpText').textContent=`HP ${Math.ceil(player?.hp||0)}/${player?.max||120}`;$('#playerHp').style.width=`${100*(player?.hp||0)/(player?.max||120)}%`;$('#craftText').textContent=selected.toUpperCase();$('#enemyText').textContent=`TARGET ${wave}/3`;$('#enemyHp i').style.width=`${enemy?100*enemy.hp/enemy.max:0}%`;$('#enemyBreak i').style.width=`${enemy?enemy.break:0}%`;$('#charge i').style.width=`${player?.s||0}%`;$('#timeText').textContent=fmt(elapsed);$('#special').disabled=phase!=='play'||(player?.s||0)<100;$('#def').disabled=phase!=='play'||defCool>0;$('#fire').disabled=phase!=='play';}
function update(dt){if(phase!=='play'||paused)return;elapsed+=dt;clock+=dt;shotCool=Math.max(0,shotCool-dt);defCool=Math.max(0,defCool-dt);guard=Math.max(0,guard-dt);invul=Math.max(0,invul-dt);over=Math.max(0,over-dt);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt*20);noticeTime=Math.max(0,noticeTime-dt);const moveX=joy.x+((keys.ArrowRight||keys.d)?1:0)-((keys.ArrowLeft||keys.a)?1:0),moveY=joy.y+((keys.ArrowDown||keys.s)?1:0)-((keys.ArrowUp||keys.w)?1:0);aim.x=clamp(aim.x+moveX*dt*.58,.07,.93);aim.y=clamp(aim.y+moveY*dt*.70,.13,.78);if(fireHeld||keys.j||keys.J||keys[' '])shoot();if(enemy?.active){enemy.t+=dt;enemy.coreOpen=Math.max(0,enemy.coreOpen-dt);enemy.stun=Math.max(0,enemy.stun-dt);if(enemy.stun<=0){enemy.x=clamp(.5+Math.sin(enemy.t*(.8+wave*.17))*(.23+wave*.02),.20,.8);enemy.y=.34+Math.sin(enemy.t*.73)*.065;enemy.attack-=dt;if(enemy.attack<=0){enemy.wind=.78;enemy.attack=2.7-wave*.20+(enemy.weapon[0]===0&&enemy.weapon[1]===0?.65:0)}if(enemy.wind>0){enemy.wind-=dt;if(enemy.wind<=0)strike()}}else{enemy.wind=0}}shots=shots.filter(x=>(x.life-=dt)>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);updateHUD()}
function fit(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;ctx.save();ctx.clearRect(0,0,w,h);let sh=shake?rand(-shake,shake):0;ctx.translate(sh,sh*.5);const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#091a31');g.addColorStop(.60,'#1d3a56');g.addColorStop(1,'#0e1a2d');ctx.fillStyle=g;ctx.fillRect(-20,-20,w+40,h+40);
// Perspective runway: larger near the viewer.
ctx.fillStyle='#132b42';ctx.beginPath();ctx.moveTo(w*.37,h*.18);ctx.lineTo(w*.63,h*.18);ctx.lineTo(w*1.22,h*.94);ctx.lineTo(-w*.22,h*.94);ctx.closePath();ctx.fill();ctx.strokeStyle='#52738c66';ctx.lineWidth=1;for(let i=0;i<10;i++){let y=h*(.22+Math.pow(i/9,1.65)*.73);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}for(let i=-5;i<=5;i++){ctx.beginPath();ctx.moveTo(w*.5,h*.18);ctx.lineTo(w*(.5+i*.17),h);ctx.stroke()}
// Enemy silhouette with weapon hardpoints and weak core.
if(enemy?.active){const x=enemy.x*w,y=enemy.y*h,scale=Math.min(w/340,1.25),v=enemy.stun>0;ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.shadowColor=v?'#ffd075':'#f6769b';ctx.shadowBlur=v?22:9;ctx.fillStyle=v?'#ab805c':'#bc5977';ctx.strokeStyle='#ffc5d6';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-45);ctx.lineTo(24,-23);ctx.lineTo(24,32);ctx.lineTo(0,43);ctx.lineTo(-24,32);ctx.lineTo(-24,-23);ctx.closePath();ctx.fill();ctx.stroke();for(const i of [-1,1]){const ix=i*39;ctx.fillStyle=enemy.weapon[i===-1?0:1]>0?'#c7708a':'#475c6d';ctx.beginPath();ctx.roundRect(ix-12,-13,24,42,5);ctx.fill();ctx.stroke();ctx.fillStyle='#1b3043';ctx.fillRect(ix-12,34,24,4);ctx.fillStyle='#ffa7a7';ctx.fillRect(ix-12,34,24*enemy.weapon[i===-1?0:1]/enemy.weaponMax,4)}ctx.beginPath();ctx.arc(0,-8,14,0,Math.PI*2);ctx.fillStyle='#ffcf6e';ctx.fill();ctx.strokeStyle='#fff0b0';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff1bb';ctx.beginPath();ctx.arc(0,-8,6,0,Math.PI*2);ctx.fill();ctx.restore();if(enemy.wind>0){ctx.strokeStyle=`rgba(255,104,117,${.5+Math.sin(clock*18)*.25})`;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y,Math.min(w*.25,100),h*.10,0,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffbfc6';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText('INCOMING ATTACK',x,y-h*.13)}}
// cockpit at the bottom foreground
ctx.fillStyle='#1a405a';ctx.beginPath();ctx.moveTo(w*.16,h+10);ctx.lineTo(w*.34,h*.86);ctx.lineTo(w*.47,h*.92);ctx.lineTo(w*.53,h*.92);ctx.lineTo(w*.66,h*.86);ctx.lineTo(w*.84,h+10);ctx.closePath();ctx.fill();ctx.strokeStyle='#7cc6e1';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#65d4e9';ctx.beginPath();ctx.moveTo(w*.5,h*.84);ctx.lineTo(w*.58,h*.96);ctx.lineTo(w*.42,h*.96);ctx.closePath();ctx.fill();
// shot tracers
for(const s of shots){ctx.strokeStyle=s.c;ctx.globalAlpha=Math.min(1,s.life/.13);ctx.lineWidth=3;ctx.shadowBlur=15;ctx.shadowColor=s.c;ctx.beginPath();ctx.moveTo(w*.5,h*.88);ctx.lineTo(s.tx*w,s.ty*h);ctx.stroke();ctx.shadowBlur=0}ctx.globalAlpha=1;
for(const p of particles){ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillRect(p.x*w,p.y*h,3,3)}ctx.globalAlpha=1;
// reticle
const ax=aim.x*w,ay=aim.y*h;ctx.strokeStyle='#9ef5fc';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ax,ay,17,0,Math.PI*2);ctx.stroke();for(let i=0;i<4;i++){let a=i*Math.PI/2;ctx.beginPath();ctx.moveTo(ax+Math.cos(a)*22,ay+Math.sin(a)*22);ctx.lineTo(ax+Math.cos(a)*30,ay+Math.sin(a)*30);ctx.stroke()}ctx.fillStyle='#ebfcff';ctx.beginPath();ctx.arc(ax,ay,2,0,Math.PI*2);ctx.fill();if(guard>0){ctx.strokeStyle='#7adbe7';ctx.lineWidth=5;ctx.beginPath();ctx.arc(w*.5,h*.82,w*.24,Math.PI*1.03,Math.PI*1.97);ctx.stroke()}if(invul>0){ctx.fillStyle='rgba(172,141,255,.13)';ctx.fillRect(0,0,w,h)}if(over>0){ctx.strokeStyle='#ca9cff';ctx.lineWidth=4;ctx.strokeRect(5,5,w-10,h-10)}if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.4})`;ctx.fillRect(0,0,w,h)}if(noticeTime>0){ctx.font='900 18px system-ui';ctx.textAlign='center';ctx.fillStyle=hitNotice==='MISS'?'#b4c4ce':'#ffe1a2';ctx.fillText(hitNotice,w/2,h*.17)}ctx.restore()}
function frame(ms){let dt=prev?Math.min(.035,(ms-prev)/1000):0;prev=ms;update(dt);draw();requestAnimationFrame(frame)}
